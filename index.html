<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدينة الحكايا ثلاثية الأبعاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: سينمائي، هادئ، فاخر — مدينة أندلسية عند الغروب
   IDEA: مجسّم معماري لمدينة تُبنى بأسماء المتابعين
   PICTURE: المدينة ثلاثية الأبعاد نفسها تملأ الشاشة
   COLOUR and TYPE: حبر ليلي #0E1A2B، ذهب #C9A45C، عاج #F3EAD8 — Aref Ruqaa للعناوين وAmiri للنص
   LAYOUT: المشهد كامل الشاشة، شريط أدوات صغير، ولوحة أسماء تنزلق من الجانب */
:root{color-scheme:dark;--ink:#F3EAD8;--gold:#C9A45C;--gold2:#E6C98A;--glass:rgba(14,26,43,.82);--line:rgba(201,164,92,.45)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0E1A2B;color:var(--ink);font:16px/1.5 'Amiri',serif}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(40,15,0,.38) 100%)}#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{font-size:22px;position:absolute;left:0;top:0;transform-origin:50% 100%;white-space:nowrap;text-align:center;pointer-events:none;will-change:transform}
.lb b{display:block;font-family:'Aref Ruqaa',serif;font-weight:700;color:var(--gold2);text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 2px #000;line-height:1.1}
.lb i{display:block;font-style:normal;font-size:.55em;color:var(--ink);opacity:.85;text-shadow:0 1px 4px #000}
.lb.num b{color:rgba(243,234,216,.55);font-family:'Amiri',serif;font-weight:400}
header{position:fixed;top:0;inset-inline:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(rgba(14,26,43,.85),rgba(14,26,43,0));pointer-events:none}
header>*{pointer-events:auto}
h1{margin:0;font-family:'Aref Ruqaa',serif;font-size:34px;line-height:1.05;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.count{font-size:17px;opacity:.9;margin-inline-end:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:16px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--gold)}
button[aria-pressed=true]{background:var(--gold);color:#0E1A2B;border-color:var(--gold)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#panel{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(380px,92vw);background:var(--glass);backdrop-filter:blur(10px);border-inline-end:1px solid var(--line);padding:84px 20px 20px;display:flex;flex-direction:column;gap:12px;transform:translateX(105%);transition:transform .35s ease;z-index:5}
#panel.open{transform:none}
#panel h2{margin:0;font-family:'Aref Ruqaa',serif;font-size:28px;color:var(--gold)}
#panel p{margin:0;font-size:15px;opacity:.8}
textarea{flex:1;min-height:180px;resize:none;font:16px/1.7 'Amiri',serif;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
.dist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:15px}
.dist span{display:flex;align-items:center;gap:8px}.dist s{width:14px;height:14px;border-radius:3px;flex:none;text-decoration:none}
#card{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--gold);border-radius:14px;padding:14px 26px;text-align:center;display:none;z-index:4}
#card b{display:block;font-family:'Aref Ruqaa',serif;font-size:30px;color:var(--gold2)}
#card span{font-size:16px;opacity:.85}
#hint{position:fixed;bottom:16px;inset-inline-end:16px;font-size:14px;opacity:.65;pointer-events:none}
body.inside header,body.inside #labels,body.inside #card,body.inside #hint,body.cine header,body.cine #panel,body.cine #hint,body.cine #card{display:none}
#cineExit{position:fixed;inset:0;display:none;z-index:9}
body.cine #cineExit{display:block;background:transparent}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:'Aref Ruqaa',serif;font-size:32px;color:var(--gold)}
@media(max-width:600px){h1{font-size:28px}button{padding:0 12px;font-size:15px}.count{width:100%;order:3}}
</style>
</head>
<body>
<div id="loading">تُبنى المدينة…</div>
<div id="scene"></div>
<div id="labels"></div>
<header>
<h1>مدينة الحكايا</h1>
<span class="count" id="count"></span>
<nav class="bar" aria-label="أدوات المشهد">
<button id="bNames" aria-pressed="false">الأسماء</button>
<button id="bNight" aria-pressed="false">ليل</button>
<button id="bSpin" aria-pressed="false">دوران</button>
<button id="bNums" aria-pressed="false">الأرقام</button>
<button id="bSeason">الموسم: عادي</button>
<button id="bAttack">هجوم ⚔️</button>
<button id="bPeace">استقبال ملك 🤝</button>
<button id="bHome">الكاميرا</button>
<button id="bCine">وضع التصوير</button>
</nav>
</header>
<aside id="panel" aria-label="أسماء المتابعين">
<h2>أصحاب البيوت</h2>
<p>اكتب أو الصق اسمًا في كل سطر بترتيب التعليقات. البيت الأول في حارة الورّاقين، والبيت ١٠٠ في حارة البساتين.</p>
<label for="names" style="font-size:15px">الأسماء</label>
<textarea id="names" spellcheck="false"></textarea>
<div class="row"><button id="bApply" aria-pressed="true">ابنِ البيوت</button><button id="bCopy">نسخ القائمة</button></div>
<div class="dist" id="dist"></div>
</aside>
<div id="atkBanner" style="position:fixed;top:120px;left:0;right:0;text-align:center;font-family:'Aref Ruqaa',serif;font-size:38px;color:#ffd36a;text-shadow:0 2px 10px #000,0 0 18px #a00;pointer-events:none;opacity:0;transition:opacity .6s;z-index:6"></div>
<div id="card" role="status"><b id="cName"></b><span id="cInfo"></span><button id="bEnter" style="display:block;margin:10px auto 0">ادخل 🚪</button></div>
<button id="bExit" style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:8;display:none">اخرج 🚪</button>
<div id="inTitle" style="position:fixed;top:66px;left:0;right:0;text-align:center;font-family:'Aref Ruqaa',serif;font-size:30px;color:#E6C98A;text-shadow:0 2px 8px #000;display:none;pointer-events:none"></div>
<div id="hint">اسحب للدوران · قرّب بإصبعين أو بالعجلة · اضغط على بيت</div>
<button id="cineExit" aria-label="الخروج من وضع التصوير"></button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/effects/OutlineEffect.js"></script>
<script>
{
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const DISTRICTS=[
 {name:'حارة الورّاقين',job:'الورّاق',color:'#C9A45C',sx:1,sz:-1},
 {name:'حارة العطّارين',job:'العطّار',color:'#D98E5A',sx:-1,sz:-1},
 {name:'حارة الصنّاع',job:'الصانع',color:'#8FB3C9',sx:-1,sz:1},
 {name:'حارة البساتين',job:'صاحب البستان',color:'#7FAE7A',sx:1,sz:1}];
const SAMPLE='الوليد\nأيوب\njijou\nمحمد فلوس\nحسين وعباس\nأحمد\nعبدالرحمن\nقصي\nشعيل\nقدوري\nعمار\nالشهم\nإبراهيم\n_10_mustafath_9_9\nخطاب\nنضال\nعبدالعليم\nعلي\nفهد\nhusi_351\nrmhlyllwsh\nمحمد\nصبحي\nhamamm_sha_1\nحسين\ncr7_the_best97\nبلال\nتيم\nعبد القادر\nريان\nدار أحمد\nمحمد العدوي\nكرم\nبكور\nعبدالله\nelbardouia\nمحمد الأزرق\nآدم\nap44lq\nsyd48665';
const NEW_NAMES=['أحمد','عبدالرحمن','قصي','شعيل','قدوري','عمار','الشهم','إبراهيم','_10_mustafath_9_9','خطاب','نضال','عبدالعليم','علي','فهد','husi_351','rmhlyllwsh','محمد','صبحي','hamamm_sha_1','حسين','cr7_the_best97','بلال','تيم','عبد القادر','ريان','دار أحمد','محمد العدوي','كرم','بكور','عبدالله','elbardouia','محمد الأزرق','آدم','ap44lq','syd48665'];
const $=id=>document.getElementById(id);

try{const s=localStorage.getItem('hakaya-names-v7');names=(s!==null?s:SAMPLE).split('\n')}catch(e){names=SAMPLE.split('\n')}

try{if(!localStorage.getItem('hakaya-added-v30')){NEW_NAMES.forEach(n=>{if(!names.includes(n))names.push(n)});localStorage.setItem('hakaya-names-v7',names.join('\n'));localStorage.setItem('hakaya-added-v30','1')}}catch(e){NEW_NAMES.forEach(n=>{if(!names.includes(n))names.push(n)})}
{const RI=names.indexOf('مطعم قدوري');if(RI!==25){if(RI>=0)names.splice(RI,1);if(names.length>25)names.splice(25,0,'مطعم قدوري')}}
names=names.slice(0,100);
// بيوت بمكان محدد (طلبات «جنب فلان»): هيثم مقابل دار أيوب وجيجو عبر الشارع
{const FIXED={'هيثم':76};for(const[n,i]of Object.entries(FIXED)){const k=names.indexOf(n);if(k>=0&&k!==i)names.splice(k,1);if(names.length<=i)names[i]=n;else if(names[i]!==n)names.splice(i,0,n)}names=names.slice(0,100)}
$('names').value=names.join('\n');
$('dist').innerHTML=DISTRICTS.map((d,i)=>`<span><s style="background:${d.color}"></s>${d.name} ${AR(i*25+1)}–${AR(i*25+25)}</span>`).join('');

if(!window.THREE){$('loading').textContent='تعذّر تحميل المحرّك ثلاثي الأبعاد';}
else{
const host=$('scene');
const TOUCH=matchMedia('(pointer: coarse)').matches;
const QLV=(()=>{let q='';try{q=localStorage.getItem('hakaya-q2')||''}catch(e){}return ['high','mid','low'].includes(q)?q:(TOUCH?'mid':'high')})();
const renderer=new THREE.WebGLRenderer({antialias:QLV==='high',powerPreference:'high-performance'});
const QSET={high:{max:TOUCH?1.75:2,min:1,sh:TOUCH?6:3},mid:{max:1.25,min:.75,sh:12},low:{max:.9,min:.55,sh:30}};
const PERF={max:Math.min(devicePixelRatio,QSET[QLV].max),min:QSET[QLV].min,sh:QSET[QLV].sh,q:QLV,pr:0,acc:0,n:0,t0:0,fr:0,low:false};PERF.pr=PERF.max;
renderer.setPixelRatio(PERF.pr);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=TOUCH?THREE.PCFShadowMap:THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;renderer.shadowMap.needsUpdate=true;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
// ستايل كرتوني: ظلال على ٣ درجات + ألوان أزهى + حدود سوداء في وضع اللعب
const GRAD=(()=>{const d=new Uint8Array([110,110,110,255,185,185,185,255,255,255,255,255]);const t=new THREE.DataTexture(d,3,1,THREE.RGBAFormat);t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;return t})();
// ستايل «الفيديو»: إضاءة ذهبية ناعمة بدون حدود كرتونية
function TM(p){p=Object.assign({roughness:.85,metalness:0},p||{});delete p.gradientMap;p.metalness=Math.min(+p.metalness||0,.3);let m;if(QLV!=='high'){delete p.roughness;delete p.metalness;delete p.envMapIntensity;delete p.flatShading;m=new THREE.MeshLambertMaterial(p)}else m=new THREE.MeshStandardMaterial(p);
 if(m.transparent||m.side===THREE.BackSide)m.userData.outlineParameters={visible:false};else m.userData.outlineParameters={thickness:.0035,color:[.08,.05,.03],alpha:1};return m}
let OUT=null;
host.appendChild(renderer.domElement);{const v=document.createElement('div');v.id='vig';host.after(v)}
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,0.5,1200);
let fly=null;
const HOME={p:new THREE.Vector3(105,85,125),t:new THREE.Vector3(0,0,8)};
camera.position.copy(HOME.p);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.copy(HOME.t);controls.enableDamping=true;controls.dampingFactor=.06;
controls.rotateSpeed=TOUCH?.55:.7;controls.zoomSpeed=TOUCH?.7:.9;controls.panSpeed=.6;controls.screenSpacePanning=false;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
controls.addEventListener('start',()=>{fly=null});
controls.maxPolarAngle=Math.PI/2.15;controls.minDistance=18;controls.maxDistance=320;controls.autoRotateSpeed=.6;

const hemi=new THREE.HemisphereLight(0xb8cde6,0x8a7454,.95);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd29a,1.35);sun.position.set(-150,62,58);sun.castShadow=true;
sun.shadow.mapSize.set(QLV==="high"?2048:1024,QLV==="high"?2048:1024);Object.assign(sun.shadow.camera,{left:-110,right:110,top:110,bottom:-110,near:10,far:400});sun.shadow.bias=-.0005;
scene.add(sun);
const M=(c,o={})=>new TM(Object.assign({color:c,roughness:.85,metalness:0},o));
const mat={ground:M(0xb9a77e),pave:M(0xd9c6a2),street:M(0xc7ae84),wall:M(0xc89f6c),tower:M(0xbd9361),house:M(0xf1e7d6),house2:M(0xe8d9c0),roof:M(0xb5603a),door:M(0x5a3a22),plaque:M(0x7a5634),gold:M(0xC9A45C,{emissive:0x5a3e10,emissiveIntensity:.6,metalness:.4,roughness:.4}),water:M(0x2f6f99,{roughness:.25,metalness:.2}),leaf:M(0x3f6b3c),trunk:M(0x6b4a2e),dome:M(0xd8b26a,{metalness:.35,roughness:.45}),red:M(0xa8432e),win:M(0x2a1c10)};
const shadowy=m=>{m.castShadow=true;m.receiveShadow=true;return m};
const box=(w,h,d,m,x,y,z)=>{const o=shadowy(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m));o.position.set(x,y,z);scene.add(o);return o};
const cyl=(r1,r2,h,m,x,y,z,seg=16)=>{const o=shadowy(new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m));o.position.set(x,y,z);scene.add(o);return o};

// الأرض والنهر
const g=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mat.ground);g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
const pave=new THREE.Mesh(new THREE.CircleGeometry(57,10),mat.pave);pave.rotation.x=-Math.PI/2;pave.position.y=.05;pave.receiveShadow=true;scene.add(pave);
box(5.5,.1,112,mat.street,0,.1,-2).castShadow=false;box(5.5,.1,20,mat.street,0,.1,65.5).castShadow=false;box(112,.1,5.5,mat.street,0,.1,0).castShadow=false;
const river=new THREE.Mesh(new THREE.PlaneGeometry(900,22),mat.water);river.rotation.x=-Math.PI/2;river.position.set(0,.15,86);scene.add(river);
// القنطرة
box(7,1.2,30,mat.wall,0,2.2,86);
for(let i=-1;i<=1;i++){box(7,2.2,2,mat.tower,0,1.1,86+i*9)}
for(let i=-1;i<=1;i+=2){box(.6,1,30,mat.tower,i*3.2,3.3,86)}

const R=58,N=10,pts=[];
for(let k=0;k<N;k++){const a=Math.PI*2*k/N;pts.push(new THREE.Vector2(R*Math.cos(a),R*Math.sin(a)))}
pts.forEach((p,k)=>{
 const q=pts[(k+1)%N],mx=(p.x+q.x)/2,mz=(p.y+q.y)/2,len=p.distanceTo(q),ang=Math.atan2(q.y-p.y,q.x-p.x);
 const isGate=mz>50&&Math.abs(mx)<10;
 if(isGate){
  [-1,1].forEach(s=>{const o=box(len/2-4,7,2.2,mat.wall,mx+s*(len/4+2),3.5,mz);o.rotation.y=-ang});
  box(4,12,4,mat.tower,-5.5,6,mz);box(4,12,4,mat.tower,5.5,6,mz);box(15,3,4,mat.tower,0,10.5,mz);
  const arch=new THREE.Mesh(new THREE.TorusGeometry(3.5,.45,8,24,Math.PI*1.25),mat.gold);arch.position.set(0,7.2,mz+2.1);arch.rotation.z=-Math.PI*.125;scene.add(arch);
 }else{
  const o=box(len,7,2.2,mat.wall,mx,3.5,mz);o.rotation.y=-ang;
  for(let c=-len/2+1.5;c<len/2;c+=3){const m=box(1.4,1.2,2.4,mat.wall,mx+Math.cos(ang)*c,7.6,mz+Math.sin(ang)*c);m.rotation.y=-ang}
 }
 cyl(3,3.4,11,mat.tower,p.x,5.5,p.y,12);cyl(3.4,3.4,.8,mat.tower,p.x,11.4,p.y,12);
});

// الجامع الكبير
const mosqueBody=box(15,5,15,mat.house,0,2.5,0);mosqueBody.userData.mosque=1;box(15.6,.6,15.6,mat.red,0,5.2,0);
const dome=shadowy(new THREE.Mesh(new THREE.SphereGeometry(5,32,16,0,Math.PI*2,0,Math.PI/2),mat.dome));dome.position.set(0,5.4,0);scene.add(dome);
cyl(.15,.15,2.2,mat.gold,0,11.5,0,6);
for(let i=-2;i<=2;i++){[[i*2.6,2.2,7.55],[i*2.6,2.2,-7.55]].forEach(a=>box(1.2,2.6,.1,mat.win,...a));[[7.55,2.2,i*2.6],[-7.55,2.2,i*2.6]].forEach(a=>box(.1,2.6,1.2,mat.win,...a))}
box(3.4,20,3.4,mat.house2,6,10,6);box(4,.6,4,mat.red,6,17,6);box(2.4,3,2.4,mat.house,6,21.5,6);
const mc=shadowy(new THREE.Mesh(new THREE.SphereGeometry(1.3,16,8,0,Math.PI*2,0,Math.PI/2),mat.dome));mc.position.set(6,23,6);scene.add(mc);
// خزانة الكتب (شمال)
box(14,7,9,mat.house2,0,3.5,-46);box(14.6,.6,9.6,mat.red,0,7.2,-46);
const lc=shadowy(new THREE.Mesh(new THREE.ConeGeometry(6,4,4),mat.roof));lc.position.set(0,9.5,-46);lc.rotation.y=Math.PI/4;lc.scale.set(1.2,1,.8);scene.add(lc);

for(let i=0;i<6;i++){box(3.2,3.4,3.6,mat.house2,-22-i*4,1.7,4.9);box(3.2,3.4,3.6,mat.house2,-22-i*4,1.7,-4.9)}
box(25,.4,13.6,mat.roof,-32,3.6,0).castShadow=false;
// الحمّام (شرق) قباب صغيرة
box(12,4,5.4,mat.house,44,2,0);
[[40,0],[44,-1.2],[44,1.2],[48,0]].forEach(([x,z])=>{const d=shadowy(new THREE.Mesh(new THREE.SphereGeometry(1.6,16,8,0,Math.PI*2,0,Math.PI/2),mat.house2));d.position.set(x,4,z);scene.add(d)});
// قصر الإمارة وحدائقه (خارج السور شمالًا)
box(30,9,18,mat.house,0,4.5,-92);box(30.6,.8,18.6,mat.red,0,9.3,-92);box(8,14,8,mat.house2,-15,7,-92);box(8,14,8,mat.house2,15,7,-92);
// قصر الملك: قباب الأبراج، النوافذ المقوّسة، قاعة العرش، السور الملكي، والحرس الملكي
const TAGS=[];
{
 const PZ=-92,FZ=-82.92;
