<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدينة الحكايا ثلاثية الأبعاد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: سينمائي، هادئ، فاخر — مدينة أندلسية عند الغروب
   IDEA: مجسّم معماري لمدينة تُبنى بأسماء المتابعين
   PICTURE: المدينة ثلاثية الأبعاد نفسها تملأ الشاشة
   COLOUR and TYPE: حبر ليلي #0E1A2B، ذهب #C9A45C، عاج #F3EAD8 — Aref Ruqaa للعناوين وAmiri للنص
   LAYOUT: المشهد كامل الشاشة، شريط أدوات صغير، ولوحة أسماء تنزلق من الجانب */
:root{color-scheme:dark;--ink:#F3EAD8;--gold:#C9A45C;--gold2:#E6C98A;--glass:rgba(14,26,43,.82);--line:rgba(201,164,92,.45)}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0E1A2B;color:var(--ink);font:16px/1.5 'Amiri',serif}
#scene{position:fixed;inset:0}
#scene canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{font-size:22px;position:absolute;left:0;top:0;transform-origin:50% 100%;white-space:nowrap;text-align:center;pointer-events:none;will-change:transform}
.lb b{display:block;font-family:'Aref Ruqaa',serif;font-weight:700;color:var(--gold2);text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 2px #000;line-height:1.1}
.lb i{display:block;font-style:normal;font-size:.55em;color:var(--ink);opacity:.85;text-shadow:0 1px 4px #000}
.lb.num b{color:rgba(243,234,216,.55);font-family:'Amiri',serif;font-weight:400}
header{position:fixed;top:0;inset-inline:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 16px;background:linear-gradient(rgba(14,26,43,.85),rgba(14,26,43,0));pointer-events:none}
header>*{pointer-events:auto}
h1{margin:0;font-family:'Aref Ruqaa',serif;font-size:34px;line-height:1.05;color:var(--gold);text-shadow:0 2px 8px rgba(0,0,0,.6)}
.count{font-size:17px;opacity:.9;margin-inline-end:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;font-size:16px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);background:var(--glass);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--gold)}
button[aria-pressed=true]{background:var(--gold);color:#0E1A2B;border-color:var(--gold)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
#panel{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(380px,92vw);background:var(--glass);backdrop-filter:blur(10px);border-inline-end:1px solid var(--line);padding:84px 20px 20px;display:flex;flex-direction:column;gap:12px;transform:translateX(105%);transition:transform .35s ease;z-index:5}
#panel.open{transform:none}
#panel h2{margin:0;font-family:'Aref Ruqaa',serif;font-size:28px;color:var(--gold)}
#panel p{margin:0;font-size:15px;opacity:.8}
textarea{flex:1;min-height:180px;resize:none;font:16px/1.7 'Amiri',serif;color:var(--ink);background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row button{flex:1}
.dist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;font-size:15px}
.dist span{display:flex;align-items:center;gap:8px}.dist s{width:14px;height:14px;border-radius:3px;flex:none;text-decoration:none}
#card{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--gold);border-radius:14px;padding:14px 26px;text-align:center;display:none;z-index:4}
#card b{display:block;font-family:'Aref Ruqaa',serif;font-size:30px;color:var(--gold2)}
#card span{font-size:16px;opacity:.85}
#hint{position:fixed;bottom:16px;inset-inline-end:16px;font-size:14px;opacity:.65;pointer-events:none}
body.inside header,body.inside #labels,body.inside #card,body.inside #hint,body.cine header,body.cine #panel,body.cine #hint,body.cine #card{display:none}
#cineExit{position:fixed;inset:0;display:none;z-index:9}
body.cine #cineExit{display:block;background:transparent}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-family:'Aref Ruqaa',serif;font-size:32px;color:var(--gold)}
@media(max-width:600px){h1{font-size:28px}button{padding:0 12px;font-size:15px}.count{width:100%;order:3}}
</style>
</head>
<body>
<div id="loading">تُبنى المدينة…</div>
<div id="scene"></div>
<div id="labels"></div>
<header>
<h1>مدينة الحكايا</h1>
<span class="count" id="count"></span>
<nav class="bar" aria-label="أدوات المشهد">
<button id="bNames" aria-pressed="false">الأسماء</button>
<button id="bNight" aria-pressed="false">ليل</button>
<button id="bSpin" aria-pressed="false">دوران</button>
<button id="bNums" aria-pressed="false">الأرقام</button>
<button id="bSeason">الموسم: عادي</button>
<button id="bAttack">هجوم ⚔️</button>
<button id="bPeace">استقبال ملك 🤝</button>
<button id="bHome">الكاميرا</button>
<button id="bCine">وضع التصوير</button>
</nav>
</header>
<aside id="panel" aria-label="أسماء المتابعين">
<h2>أصحاب البيوت</h2>
<p>اكتب أو الصق اسمًا في كل سطر بترتيب التعليقات. البيت الأول في حارة الورّاقين، والبيت ١٠٠ في حارة البساتين.</p>
<label for="names" style="font-size:15px">الأسماء</label>
<textarea id="names" spellcheck="false"></textarea>
<div class="row"><button id="bApply" aria-pressed="true">ابنِ البيوت</button><button id="bCopy">نسخ القائمة</button></div>
<div class="dist" id="dist"></div>
</aside>
<div id="atkBanner" style="position:fixed;top:120px;left:0;right:0;text-align:center;font-family:'Aref Ruqaa',serif;font-size:38px;color:#ffd36a;text-shadow:0 2px 10px #000,0 0 18px #a00;pointer-events:none;opacity:0;transition:opacity .6s;z-index:6"></div>
<div id="card" role="status"><b id="cName"></b><span id="cInfo"></span><button id="bEnter" style="display:block;margin:10px auto 0">ادخل 🚪</button></div>
<button id="bExit" style="position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:8;display:none">اخرج 🚪</button>
<div id="inTitle" style="position:fixed;top:66px;left:0;right:0;text-align:center;font-family:'Aref Ruqaa',serif;font-size:30px;color:#E6C98A;text-shadow:0 2px 8px #000;display:none;pointer-events:none"></div>
<div id="hint">اسحب للدوران · قرّب بإصبعين أو بالعجلة · اضغط على بيت</div>
<button id="cineExit" aria-label="الخروج من وضع التصوير"></button>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
{
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const DISTRICTS=[
 {name:'حارة الورّاقين',job:'الورّاق',color:'#C9A45C',sx:1,sz:-1},
 {name:'حارة العطّارين',job:'العطّار',color:'#D98E5A',sx:-1,sz:-1},
 {name:'حارة الصنّاع',job:'الصانع',color:'#8FB3C9',sx:-1,sz:1},
 {name:'حارة البساتين',job:'صاحب البستان',color:'#7FAE7A',sx:1,sz:1}];
const SAMPLE='الوليد\nأيوب\njijou\nمحمد فلوس\nحسين وعباس\nأحمد\nعبدالرحمن\nقصي\nشعيل\nقدوري\nعمار\nالشهم\nإبراهيم\n_10_mustafath_9_9\nخطاب\nنضال\nعبدالعليم\nعلي\nفهد\nhusi_351\nrmhlyllwsh\nمحمد\nصبحي\nhamamm_sha_1\nحسين\ncr7_the_best97\nبلال\nmjhwllhwy.x\nعبد القادر\nريان\nدار أحمد';
const NEW_NAMES=['أحمد','عبدالرحمن','قصي','شعيل','قدوري','عمار','الشهم','إبراهيم','_10_mustafath_9_9','خطاب','نضال','عبدالعليم','علي','فهد','husi_351','rmhlyllwsh','محمد','صبحي','hamamm_sha_1','حسين','cr7_the_best97','بلال','mjhwllhwy.x','عبد القادر','ريان','دار أحمد'];
const $=id=>document.getElementById(id);
let names=[];
try{const s=localStorage.getItem('hakaya-names-v7');names=(s!==null?s:SAMPLE).split('\n')}catch(e){names=SAMPLE.split('\n')}
names=names.map(s=>s.trim()).filter(Boolean);
try{if(!localStorage.getItem('hakaya-added-v23')){NEW_NAMES.forEach(n=>{if(!names.includes(n))names.push(n)});localStorage.setItem('hakaya-names-v7',names.join('\n'));localStorage.setItem('hakaya-added-v23','1')}}catch(e){NEW_NAMES.forEach(n=>{if(!names.includes(n))names.push(n)})}
{const RI=names.indexOf('مطعم قدوري');if(RI!==25){if(RI>=0)names.splice(RI,1);if(names.length>25)names.splice(25,0,'مطعم قدوري')}}
names=names.slice(0,100);
$('names').value=names.join('\n');
$('dist').innerHTML=DISTRICTS.map((d,i)=>`<span><s style="background:${d.color}"></s>${d.name} ${AR(i*25+1)}–${AR(i*25+25)}</span>`).join('');

if(!window.THREE){$('loading').textContent='تعذّر تحميل المحرّك ثلاثي الأبعاد';}
else{
const host=$('scene');
const renderer=new THREE.WebGLRenderer({antialias:true});
const TOUCH=matchMedia('(pointer: coarse)').matches;
renderer.setPixelRatio(Math.min(devicePixelRatio,TOUCH?1.5:2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
host.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,0.5,1200);
let fly=null;
const HOME={p:new THREE.Vector3(105,85,125),t:new THREE.Vector3(0,0,8)};
camera.position.copy(HOME.p);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.target.copy(HOME.t);controls.enableDamping=true;controls.dampingFactor=.06;
controls.rotateSpeed=TOUCH?.55:.7;controls.zoomSpeed=TOUCH?.7:.9;controls.panSpeed=.6;controls.screenSpacePanning=false;
controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
controls.addEventListener('start',()=>{fly=null});
controls.maxPolarAngle=Math.PI/2.15;controls.minDistance=18;controls.maxDistance=320;controls.autoRotateSpeed=.6;

const hemi=new THREE.HemisphereLight(0xffe8c8,0x3a4a5e,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd29a,1.35);sun.position.set(-90,110,60);sun.castShadow=true;
sun.shadow.mapSize.set(TOUCH?1024:2048,TOUCH?1024:2048);Object.assign(sun.shadow.camera,{left:-110,right:110,top:110,bottom:-110,near:10,far:400});sun.shadow.bias=-.0005;
scene.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.85,metalness:0},o));
const mat={ground:M(0xb9a77e),pave:M(0xd9c6a2),street:M(0xc7ae84),wall:M(0xc89f6c),tower:M(0xbd9361),house:M(0xf1e7d6),house2:M(0xe8d9c0),roof:M(0xb5603a),door:M(0x5a3a22),plaque:M(0x7a5634),gold:M(0xC9A45C,{emissive:0x5a3e10,emissiveIntensity:.6,metalness:.4,roughness:.4}),water:M(0x2f6f99,{roughness:.25,metalness:.2}),leaf:M(0x3f6b3c),trunk:M(0x6b4a2e),dome:M(0xd8b26a,{metalness:.35,roughness:.45}),red:M(0xa8432e),win:M(0x2a1c10)};
const shadowy=m=>{m.castShadow=true;m.receiveShadow=true;return m};
const box=(w,h,d,m,x,y,z)=>{const o=shadowy(new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m));o.position.set(x,y,z);scene.add(o);return o};
const cyl=(r1,r2,h,m,x,y,z,seg=16)=>{const o=shadowy(new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,h,seg),m));o.position.set(x,y,z);scene.add(o);return o};

// الأرض والنهر
const g=new THREE.Mesh(new THREE.PlaneGeometry(900,900),mat.ground);g.rotation.x=-Math.PI/2;g.receiveShadow=true;scene.add(g);
const pave=new THREE.Mesh(new THREE.CircleGeometry(57,10),mat.pave);pave.rotation.x=-Math.PI/2;pave.position.y=.05;pave.receiveShadow=true;scene.add(pave);
box(5.5,.1,112,mat.street,0,.1,-2).castShadow=false;box(5.5,.1,20,mat.street,0,.1,65.5).castShadow=false;box(112,.1,5.5,mat.street,0,.1,0).castShadow=false;
const river=new THREE.Mesh(new THREE.PlaneGeometry(900,22),mat.water);river.rotation.x=-Math.PI/2;river.position.set(0,.15,86);scene.add(river);
// القنطرة
box(7,1.2,30,mat.wall,0,2.2,86);
for(let i=-1;i<=1;i++){box(7,2.2,2,mat.tower,0,1.1,86+i*9)}
for(let i=-1;i<=1;i+=2){box(.6,1,30,mat.tower,i*3.2,3.3,86)}

// السور والأبراج
const R=58,N=10,pts=[];
for(let k=0;k<N;k++){const a=Math.PI*2*k/N;pts.push(new THREE.Vector2(R*Math.cos(a),R*Math.sin(a)))}
pts.forEach((p,k)=>{
 const q=pts[(k+1)%N],mx=(p.x+q.x)/2,mz=(p.y+q.y)/2,len=p.distanceTo(q),ang=Math.atan2(q.y-p.y,q.x-p.x);
 const isGate=mz>50&&Math.abs(mx)<10;
 if(isGate){
  [-1,1].forEach(s=>{const o=box(len/2-4,7,2.2,mat.wall,mx+s*(len/4+2),3.5,mz);o.rotation.y=-ang});
  box(4,12,4,mat.tower,-5.5,6,mz);box(4,12,4,mat.tower,5.5,6,mz);box(15,3,4,mat.tower,0,10.5,mz);
  const arch=new THREE.Mesh(new THREE.TorusGeometry(3.5,.45,8,24,Math.PI*1.25),mat.gold);arch.position.set(0,7.2,mz+2.1);arch.rotation.z=-Math.PI*.125;scene.add(arch);
 }else{
  const o=box(len,7,2.2,mat.wall,mx,3.5,mz);o.rotation.y=-ang;
  for(let c=-len/2+1.5;c<len/2;c+=3){const m=box(1.4,1.2,2.4,mat.wall,mx+Math.cos(ang)*c,7.6,mz+Math.sin(ang)*c);m.rotation.y=-ang}
 }
 cyl(3,3.4,11,mat.tower,p.x,5.5,p.y,12);cyl(3.4,3.4,.8,mat.tower,p.x,11.4,p.y,12);
});

// الجامع الكبير
const mosqueBody=box(15,5,15,mat.house,0,2.5,0);mosqueBody.userData.mosque=1;box(15.6,.6,15.6,mat.red,0,5.2,0);
const dome=shadowy(new THREE.Mesh(new THREE.SphereGeometry(5,32,16,0,Math.PI*2,0,Math.PI/2),mat.dome));dome.position.set(0,5.4,0);scene.add(dome);
cyl(.15,.15,2.2,mat.gold,0,11.5,0,6);
for(let i=-2;i<=2;i++){[[i*2.6,2.2,7.55],[i*2.6,2.2,-7.55]].forEach(a=>box(1.2,2.6,.1,mat.win,...a));[[7.55,2.2,i*2.6],[-7.55,2.2,i*2.6]].forEach(a=>box(.1,2.6,1.2,mat.win,...a))}
box(3.4,20,3.4,mat.house2,6,10,6);box(4,.6,4,mat.red,6,17,6);box(2.4,3,2.4,mat.house,6,21.5,6);
const mc=shadowy(new THREE.Mesh(new THREE.SphereGeometry(1.3,16,8,0,Math.PI*2,0,Math.PI/2),mat.dome));mc.position.set(6,23,6);scene.add(mc);
// خزانة الكتب (شمال)
box(14,7,9,mat.house2,0,3.5,-46);box(14.6,.6,9.6,mat.red,0,7.2,-46);
const lc=shadowy(new THREE.Mesh(new THREE.ConeGeometry(6,4,4),mat.roof));lc.position.set(0,9.5,-46);lc.rotation.y=Math.PI/4;lc.scale.set(1.2,1,.8);scene.add(lc);
// السوق (غرب) أروقة
for(let i=0;i<6;i++){box(3.2,3.4,3.6,mat.house2,-22-i*4,1.7,4.9);box(3.2,3.4,3.6,mat.house2,-22-i*4,1.7,-4.9)}
box(25,.4,13.6,mat.roof,-32,3.6,0).castShadow=false;
// الحمّام (شرق) قباب صغيرة
box(12,4,5.4,mat.house,44,2,0);
[[40,0],[44,-1.2],[44,1.2],[48,0]].forEach(([x,z])=>{const d=shadowy(new THREE.Mesh(new THREE.SphereGeometry(1.6,16,8,0,Math.PI*2,0,Math.PI/2),mat.house2));d.position.set(x,4,z);scene.add(d)});
// قصر الإمارة وحدائقه (خارج السور شمالًا)
box(30,9,18,mat.house,0,4.5,-92);box(30.6,.8,18.6,mat.red,0,9.3,-92);box(8,14,8,mat.house2,-15,7,-92);box(8,14,8,mat.house2,15,7,-92);
// قصر الملك: قباب الأبراج، النوافذ المقوّسة، قاعة العرش، السور الملكي، والحرس الملكي
const TAGS=[];
{
 const PZ=-92,FZ=-82.92;
 [-15,15].forEach(x=>{
  for(let c=-1;c<=1;c++){box(1.4,1.1,.8,mat.house2,x+c*2.8,14.5,PZ+4.1);box(1.4,1.1,.8,mat.house2,x+c*2.8,14.5,PZ-4.1);box(.8,1.1,1.4,mat.house2,x+4.1,14.5,PZ+c*2.8);box(.8,1.1,1.4,mat.house2,x-4.1,14.5,PZ+c*2.8)}
  const d=shadowy(new THREE.Mesh(new THREE.SphereGeometry(2.6,24,12,0,Math.PI*2,0,Math.PI/2),mat.dome));d.position.set(x,14,PZ);scene.add(d);
  cyl(.08,.08,1.3,mat.gold,x,17.2,PZ,6);
  [3.5,9].forEach(y=>box(1.2,2,.1,mat.win,x,y,PZ+4.05));
 });
 for(let x=-8;x<=8;x+=4){if(x!==0)box(1.5,2.4,.1,mat.win,x,2.6,FZ);box(1.3,1.8,.1,mat.win,x,6.6,FZ)}
 box(3.2,4.6,.12,mat.door,0,2.3,FZ);
 const ar=new THREE.Mesh(new THREE.TorusGeometry(1.75,.22,8,24,Math.PI),mat.gold);ar.position.set(0,4.6,FZ+.08);scene.add(ar);
 // قاعة العرش بقبتها الكبيرة خلف القصر
 box(16,11,10,mat.house,0,5.5,-104);box(16.6,.7,10.6,mat.red,0,11.3,-104);
 const hd=shadowy(new THREE.Mesh(new THREE.SphereGeometry(4.6,32,16,0,Math.PI*2,0,Math.PI/2),mat.dome));hd.position.set(0,11.6,-104);scene.add(hd);
 cyl(.12,.12,2,mat.gold,0,17.2,-104,6);
 // السور الملكي وبوابته الشرقية
 const ew=M(0xc4955f),EH=5;
 const seg=(x1,z1,x2,z2)=>{const w=Math.abs(x2-x1)||1.6,d=Math.abs(z2-z1)||1.6,cx=(x1+x2)/2,cz=(z1+z2)/2;box(w,EH,d,ew,cx,EH/2,cz);const L=Math.max(w,d),n=Math.floor(L/2.4);for(let i=0;i<n;i++){const t=-L/2+1.2+i*2.4;if(w>d)box(1.1,1,1.8,ew,cx+t,EH+.5,cz);else box(1.8,1,1.1,ew,cx,EH+.5,cz+t)}};
 seg(-28,-61,28,-61);seg(-28,-112,28,-112);seg(-28,-61,-28,-112);seg(28,-61,28,-80);seg(28,-88,28,-112);
 [[-28,-61],[28,-61],[-28,-112],[28,-112]].forEach(([x,z])=>{cyl(2.2,2.5,8,mat.tower,x,4,z,12);const cd=shadowy(new THREE.Mesh(new THREE.SphereGeometry(2.2,16,8,0,Math.PI*2,0,Math.PI/2),mat.dome));cd.position.set(x,8,z);scene.add(cd)});

$('gTalkB').onclick=()=>{const n=game.near;if(!n)return;const me=game.user;const own=n.user&&n.user===me.u;const L=own?[`هذا مكانك يا ${me.disp}! الناس يمرّون يسلّمون عليك 😄`,...n.lines(me.disp).slice(1)]:n.lines(me.disp);game.talk={n,L,i:0};showLine()};
function showLine(){const t=game.talk;if(!t)return;if(t.i>=t.L.length){$('gTalk').style.display='none';game.talk=null;return}$('gTalkN').textContent=t.n.name;$('gTalkT').textContent=t.L[t.i];$('gTalk').style.display='block'}
$('gTalk').onclick=()=>{if(game.talk){game.talk.i++;showLine()}};
$('gEnterB').onclick=()=>{const e=game.enter;if(!e)return;$('gTalk').style.display='none';game.talk=null;if(document.pointerLockElement)document.exitPointerLock();selected=e.sel;enterPlace()};
function camOffset(){const cp=Math.cos(game.pitch);return new THREE.Vector3(Math.sin(game.yaw)*cp,Math.sin(game.pitch),Math.cos(game.yaw)*cp)}
function updateGame(t){const dt=Math.min(.05,(t-(game.last||t))/1000);game.last=t;updatePeers(dt);if(!game.on||inside)return;controls.enabled=false;
 const K=game.keys,k=c=>!game.chatOpen&&K[c];
 let fi=-game.jy+(k('KeyW')||k('ArrowUp')?1:0)-(k('KeyS')||k('ArrowDown')?1:0),si=game.jx+(k('KeyD')||k('ArrowRight')?1:0)-(k('KeyA')||k('ArrowLeft')?1:0);
 const il=Math.hypot(fi,si);if(il>1){fi/=il;si/=il}
 const sy=Math.sin(game.yaw),cy=Math.cos(game.yaw);const wx=-sy*fi+cy*si,wz=-cy*fi-sy*si;
 const shift=k('ShiftLeft')||k('ShiftRight');
 const run=k('ControlLeft')||k('ControlRight')||k('KeyR')||(!game.fly&&shift)||game.runBtn;
 const sp=game.fly?(run?30:15):(run?9.5:5.6);const a=Math.min(1,dt*(game.fly?3.2:12));
 game.vx+=(wx*sp-game.vx)*a;game.vz+=(wz*sp-game.vz)*a;
 const P=game.p,old=P.clone();
 const up=k('Space')||game.upBtn,down=(game.fly&&shift)||k('KeyC')||k('KeyQ')||game.downBtn;
 if(game.fly){const tv=(up?1:0)-(down?1:0);game.vy+=(tv*11-game.vy)*Math.min(1,dt*5)}
 else{game.vy-=26*dt;if(game.jumpQ&&game.onG){game.vy=8.4;game.onG=false}}
 game.jumpQ=false;
 const stuck=blocked(P.x,P.z,P.y);const nx=P.x+game.vx*dt,nz=P.z+game.vz*dt;
 if(stuck||!blocked(nx,nz,P.y)){P.x=nx;P.z=nz}else if(!blocked(nx,P.z,P.y)){P.x=nx;game.vz*=.3}else if(!blocked(P.x,nz,P.y)){P.z=nz;game.vx*=.3}else{game.vx*=.2;game.vz*=.2}
 P.y+=game.vy*dt;if(P.y>95){P.y=95;game.vy=Math.min(0,game.vy)}
 const fl=floorAt(P.x,P.z,Math.max(P.y,old.y));
 if(P.y<=fl){P.y=fl;if(game.vy<0)game.vy=0;game.onG=true;if(game.fly&&down)setFly(false,true)}else game.onG=!game.fly&&P.y-fl<.05;
 const hs=Math.hypot(game.vx,game.vz),moving=hs>.4;
 if(game.fp)hero.g.rotation.y=game.yaw+Math.PI;
 else if(moving){const ty=Math.atan2(game.vx,game.vz);let d=ty-hero.g.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));hero.g.rotation.y+=d*Math.min(1,dt*(game.fly?5:14))}
 game.step+=dt*hs*(game.onG?1.5:0);
 const bob=(!game.fly&&game.onG&&moving)?Math.abs(Math.sin(game.step))*.06:0,hov=game.fly?Math.sin(t/420)*.12:0;
 hero.g.position.set(P.x,P.y+bob+hov,P.z);hero.g.visible=!game.fp;
 hero.carpet.visible=game.fly;hero.carpet.rotation.x=game.fly?Math.sin(t/300)*.05:0;hero.carpet.rotation.z=game.fly?Math.sin(t/380)*.04:0;
 hero.body.rotation.x=game.fly?Math.min(.3,hs/60):0;
 const sw=moving&&game.onG?Math.sin(game.step)*.55:0;hero.arms[0].rotation.x=sw;hero.arms[1].rotation.x=-sw;
 const spread=game.fly?1.1:(!game.onG?.5:0);hero.arms[0].rotation.z=-spread;hero.arms[1].rotation.z=spread;
 meTagPos.set(P.x,P.y+2.5+hov,P.z);
 // الكاميرا
 const tgt=new THREE.Vector3(P.x,P.y+(game.fp?1.62:1.7)+hov,P.z),o=camOffset();
 if(game.fp){camera.position.copy(tgt);controls.target.copy(tgt).sub(o)}
 else{camera.position.copy(tgt).addScaledVector(o,game.dist);const gy=groundY(camera.position.x,camera.position.z)+.35;if(camera.position.y<gy)camera.position.y=gy;controls.target.copy(tgt)}
 camera.lookAt(controls.target);
 netTick(t,moving||!game.onG);
 // أقرب شخصية أو باب
 let best=null,bd=4.2;for(const n of NPCS){const d=Math.hypot(n.pos[0]-P.x,n.pos[2]-P.z);if(d<bd&&Math.abs((n.pos[1]||0)-P.y)<3){bd=d;best=n}}
 if(best!==game.near){game.near=best;$('gTalkB').style.display=best?'block':'none';if(best)$('gTalkB').textContent='💬 كلّم '+best.name;if(!best&&game.talk){game.talk=null;$('gTalk').style.display='none'}}
 let en=null;if(P.y<2){const md=Math.hypot(P.x,P.z);if(md<10.5&&md>7)en={sel:{mosque:true},t:'🚪 ادخل الجامع'};
 if(Math.hypot(P.x,P.z+82)<5.5)en={sel:{palace:true},t:'🚪 ادخل القصر'};
 if(Math.hypot(P.x+6,P.z+11)<3.2||Math.hypot(P.x+11,P.z+11)<5)en={sel:{restaurant:true},t:'🚪 ادخل المطعم'};
 for(const h of houses){if(!h.vis||h.i===25)continue;const dp=houseDoor(h.i);if(Math.hypot(dp.x-P.x,dp.z-P.z)<2.2){const n=names[h.i];en={sel:{name:n,named:true},t:'🚪 ادخل دار '+n};break}}}
 if((en&&en.t)!==(game.enter&&game.enter.t)){game.enter=en;$('gEnterB').style.display=en?'block':'none';if(en)$('gEnterB').textContent=en.t}
}

// الحلقة
const v=new THREE.Vector3();
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(t){
 if(fly){const k=Math.min(1,(t-fly.s)/1100),e=k<.5?2*k*k:1-((-2*k+2)**2)/2;camera.position.lerpVectors(fly.p0,fly.p,e);controls.target.lerpVectors(fly.t0,fly.t,e);if(k>=1)fly=null}
 updateGame(t);
 if(!(game.on&&!inside)){controls.enabled=true;controls.update()}
 if(!reduce){wheel.rotation.z-=.004;updatePeople(t/1000);updateGuards(t/1000);updateHorses(t/1000);updateAmbience(t/1000);updateKing(t/1000)}
 updatePolice(t/1000);updateArmy(t/1000,!reduce);
 updateAttack(t/1000);updateCannons(t/1000);updatePeace(t/1000);swingKings(t/1000);
 if(inside&&PAL.on)updatePalace(t/1000);
 if(inside)for(const q of inPeople){q.head.rotation.y=Math.sin(t/1000*.6+q.ph)*.5}
 updateSky();
 renderer.render(inside?inScene:scene,camera);
 const W=innerWidth,H=innerHeight;
 for(const h of houses){if(!h.vis)continue;
  v.copy(h.grp.position);v.y=h.top;const dist=camera.position.distanceTo(v);v.project(camera);
  if(v.z>1||dist>300){h.el.style.opacity=0;continue}
  const s=Math.max(.35,Math.min(1.6,60/dist));h.el.style.opacity=1;
    h.el.style.transform=`translate(${(v.x+1)/2*W}px,${(1-v.y)/2*H}px) translate(-50%,-100%) scale(${s})`;
  h.el.style.zIndex=String(1000-Math.round(dist));
 }
 if(game.on&&!inside){v.copy(meTagPos);const dist=camera.position.distanceTo(v);v.project(camera);if(v.z>1){meTag.style.opacity=0}else{meTag.style.opacity=1;meTag.style.transform=`translate(${(v.x+1)/2*W}px,${(1-v.y)/2*H}px) translate(-50%,-100%) scale(${Math.max(.6,Math.min(1.3,14/dist))})`;meTag.style.zIndex='2000'}}else meTag.style.opacity=0;
 if(game.fp)meTag.style.opacity=0;
 for(const p of NET.peers.values()){if(!game.on||inside){p.tag.style.opacity=0;continue}v.copy(p.tpos);const dist=camera.position.distanceTo(v);v.project(camera);if(v.z>1||dist>160){p.tag.style.opacity=0}else{p.tag.style.opacity=1;p.tag.style.transform=`translate(${(v.x+1)/2*W}px,${(1-v.y)/2*H}px) translate(-50%,-100%) scale(${Math.max(.5,Math.min(1.3,14/dist))})`;p.tag.style.zIndex='1999'}}
 for(const tg of TAGS){v.copy(tg.pos);const dist=camera.position.distanceTo(v);v.project(camera);
  if(v.z>1||dist>320){tg.el.style.opacity=0}else{const s=Math.max(.45,Math.min(1.7,70/dist));tg.el.style.opacity=1;tg.el.style.transform=`translate(${(v.x+1)/2*W}px,${(1-v.y)/2*H}px) translate(-50%,-100%) scale(${s})`;tg.el.style.zIndex=String(1000-Math.round(dist))}}
 requestAnimationFrame(loop);
}
$('loading').remove();requestAnimationFrame(loop);
}
}
</script>
